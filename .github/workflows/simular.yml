name: Simular ASAGI (emulador Android)
# Emulador Android real (como Android Studio): instala el APK publicado, abre ASAGI,
# toma capturas, guarda logcat y errores JS, y sube todo a la rama "simulacion".
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build ASAGI APK"]
    types: [completed]
concurrency:
  group: simular
  cancel-in-progress: true
jobs:
  simular:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Bajar el APK publicado
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download latest -p asagi.apk -D . --clobber && ls -la asagi.apk
      - name: Emulador + simulacion
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/simular.sh
      - name: Subir resultados a la rama simulacion
        if: always()
        run: |
          [ -d sim ] || exit 0
          cd sim
          git init -q -b simulacion
          git config user.name "asagi-sim"; git config user.email "asagi-sim@users.noreply.github.com"
          git add -A && git commit -qm "simulacion ${GITHUB_SHA::7} $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" simulacion
