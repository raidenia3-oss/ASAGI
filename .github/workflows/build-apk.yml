name: Build ASAGI APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # ubuntu-latest ya trae el Android SDK con licencias aceptadas;
      # android-actions/setup-android@v3 fallaba en este runner, así que se omite
      # y se comprueba directamente que el SDK exista.
      - name: Ver Android SDK preinstalado
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"
      - run: npm install
      - run: npm run build
      - run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      # Firma estable: todos los builds usan la MISMA llave (el keystore
      # vive en GitHub Secrets, nunca en el repo). Si falta el secret,
      # se avisa y se firma con la llave de depuración del runner.
      - name: Descargar keystore de firma
        env:
          KEYSTORE_B64: ${{ secrets.ASAGI_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/asagi.keystore"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/asagi.keystore" >> "$GITHUB_ENV"
            echo "Keystore de firma restaurado."
          else
            echo "::warning::Secret ASAGI_KEYSTORE_B64 no definido: este build se firma con la llave de depuración del runner (NO estable)."
          fi
      - working-directory: android
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ASAGI_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ASAGI_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ASAGI_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Verificar firma del APK
        run: |
          echo "Certificado con el que se ha firmado este APK:"
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/*.apk | grep -E "Owner:|SHA256:"
      - uses: actions/upload-artifact@v4
        with:
          name: asagi-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Preparar asagi.apk
        run: cp android/app/build/outputs/apk/debug/*.apk asagi.apk
      - name: Publicar en la Release "latest"
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: asagi.apk
