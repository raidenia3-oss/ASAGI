apply plugin: 'com.android.application'

// Stable signing for CI: when the workflow downloads the keystore from
// GitHub Secrets (SIGNING_KEYSTORE_FILE + credentials), the debug build is
// signed with THAT key so successive APK updates do not fail with a
// "signature conflict". Without those variables (local development) the
// standard debug key is used.
def ciKeystorePath = System.getenv("SIGNING_KEYSTORE_FILE")
def ciSigningEnabled = ciKeystorePath != null && file(ciKeystorePath).exists()

android {
    namespace "com.asagi.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.asagi.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f1f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (ciSigningEnabled) {
            ci {
                storeFile file(ciKeystorePath)
                storePassword System.getenv("SIGNING_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            if (ciSigningEnabled) {
                signingConfig signingConfigs.ci
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Merge the native library bundle produced by the capacitor-asagi-brain
// module into the app's arm64-v8a directory so libasagi_brain.so ends up
// in the APK. This is required because the top-level module's mergeDebugJniLibFolders
// only picks up native libs from AARs and the capacitor-android module,
// not from a separate :capacitor-asagi-brain library project.
tasks.register('mergeAsagiBrainNativeLibs', Copy) {
    dependsOn ':capacitor-asagi-brain:mergeDebugJniLibFolders'
    from ':capacitor-asagi-brain'
    include 'src/main/jniLibs/arm64-v8a/*.so'
    into 'app/src/main/jniLibs/arm64-v8a'
    rename '(.+)\\.so', 'asagi_brain_$1.so'
    duplicatesStrategy 'exclude'
}


