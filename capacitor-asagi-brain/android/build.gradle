apply plugin: 'com.android.library'

android {
    namespace "com.asagi.brain"
    compileSdk rootProject.ext.compileSdkVersion

    // Toolchain fijado: misma versión de NDK y CMake en local y en CI.
    ndkVersion "26.3.11579264"

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        // Solo arm64-v8a: el objetivo es un móvil con 4 GB de RAM.
        // Compilar más ABI solo inflaría el APK y alargaría el CI.
        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                // STL estática: evita empaquetar libc++_shared.so (una sola .so nativa).
                arguments "-DANDROID_STL=c++_static"
                cppFlags "-std=c++17 -O2"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':capacitor-android')
    // NotificationCompat para el aviso de descarga del modelo.
    implementation "androidx.core:core:$androidxCoreVersion"
}
